# nginx site for HarborFinance (see DEPLOY.md).
# Copy to /etc/nginx/sites-available/harborfinance,
# enable it, then run certbot to add HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name harborfinancetrading.com;

    # Uploads (KYC documents, support attachments, trader images) are limited to 8 MB by the app.
    client_max_body_size 10m;

    # Live notifications use Server-Sent Events: no buffering, long-lived connection.
    location /api/realtime {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) so visitors can't spoof their IP past rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Redirect www to the bare domain (certbot adds the HTTPS equivalents).
# Remove this block if you prefer www as the main address.
server {
    listen 80;
    listen [::]:80;
    server_name www.harborfinancetrading.com;
    return 301 http://harborfinancetrading.com$request_uri;
}
