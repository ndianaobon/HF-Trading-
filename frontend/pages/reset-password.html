<!-- @page {"title": "Choose a new password", "description": "Set a new password for your HarborFinance account.", "layout": "auth", "script": "auth-reset", "robots": "noindex"} -->
<div id="reset-root">
  <h1 class="font-display text-3xl font-extrabold tracking-tight text-white">Choose a new password</h1>
  <p class="mt-2 text-sm text-muted">For your security, all existing sessions will be signed out.</p>
  <form method="post" id="reset-form" class="mt-8 space-y-5" novalidate>
    <div class="field">
      <label class="label" for="password">New password</label>
      <div class="input-wrap"><input id="password" name="password" type="password" class="input pr-12" autocomplete="new-password" /><button type="button" class="toggle-pw" data-toggle-pw aria-label="Show password"><i data-icon="eye" class="h-4 w-4"></i></button></div>
      <p class="field-error" data-error-for="password" hidden></p>
      <p class="hint">At least 10 characters with upper and lower case, a number and a symbol.</p>
    </div>
    <div class="field">
      <label class="label" for="confirmPassword">Confirm new password</label>
      <div class="input-wrap"><input id="confirmPassword" name="confirmPassword" type="password" class="input pr-12" autocomplete="new-password" /><button type="button" class="toggle-pw" data-toggle-pw aria-label="Show password"><i data-icon="eye" class="h-4 w-4"></i></button></div>
      <p class="field-error" data-error-for="confirmPassword" hidden></p>
    </div>
    <div data-form-error hidden></div>
    <button type="submit" class="btn btn-primary btn-lg w-full">Update password</button>
  </form>
</div>
