<!-- @page {"title": "Admin Sign In", "description": "HarborFinance admin console", "layout": "auth", "script": "admin-login", "robots": "noindex, nofollow"} -->
<div class="inline-flex items-center gap-2 rounded-full border border-accent/30 bg-accent-soft px-3 py-1 text-xs font-bold tracking-wide text-accent uppercase"><i data-icon="shield-half" class="h-3.5 w-3.5"></i> Admin console</div>
<h1 class="mt-4 font-display text-3xl font-extrabold tracking-tight text-white">Staff sign in</h1>
<p class="mt-2 text-sm text-muted">For HarborFinance staff only. Customers sign in at <a href="/login" class="font-semibold text-accent hover:text-accent-strong">the customer login</a>.</p>
<div id="login-notice" class="mt-6" hidden></div>
<form method="post" id="admin-login-form" class="mt-8 space-y-5" novalidate>
  <div class="field">
    <label class="label" for="email">Staff email</label>
    <div class="input-wrap"><span class="input-prefix"><i data-icon="mail" class="h-4 w-4"></i></span><input id="email" name="email" type="email" class="input" autocomplete="username" /></div>
    <p class="field-error" data-error-for="email" hidden></p>
  </div>
  <div class="field">
    <label class="label" for="password">Password</label>
    <div class="input-wrap"><span class="input-prefix"><i data-icon="lock" class="h-4 w-4"></i></span><input id="password" name="password" type="password" class="input pr-12" autocomplete="current-password" /><button type="button" class="toggle-pw" data-toggle-pw aria-label="Show password"><i data-icon="eye" class="h-4 w-4"></i></button></div>
    <p class="field-error" data-error-for="password" hidden></p>
  </div>
  <div data-form-error hidden></div>
  <button type="submit" class="btn btn-primary btn-lg w-full"><i data-icon="log-in" class="h-4 w-4"></i> Sign in to admin</button>
</form>
<p class="mt-8 text-center text-xs leading-relaxed text-dim">All admin actions are recorded in the audit log with your account and IP address.</p>
