<!-- @page {"title": "Log In", "description": "Log in to your HarborFinance Trading account.", "layout": "auth", "script": "auth-login", "robots": "noindex"} -->
<h1 class="font-display text-3xl font-extrabold tracking-tight text-white">Welcome back</h1>
<p class="mt-2 text-sm text-muted">New to HarborFinance? <a href="/register" class="font-semibold text-accent hover:text-accent-strong">Create an account</a></p>
<div id="login-notice" class="mt-6" hidden></div>
<form method="post" id="login-form" class="mt-8 space-y-5" novalidate>
  <div class="field">
    <label class="label" for="email">Email</label>
    <div class="input-wrap"><span class="input-prefix"><i data-icon="mail" class="h-4 w-4"></i></span><input id="email" name="email" type="email" class="input" autocomplete="email" /></div>
    <p class="field-error" data-error-for="email" hidden></p>
  </div>
  <div class="field">
    <div class="flex items-center justify-between"><label class="label" for="password">Password</label><a href="/forgot-password" class="text-xs font-medium text-accent hover:text-accent-strong">Forgot password?</a></div>
    <div class="input-wrap"><span class="input-prefix"><i data-icon="lock" class="h-4 w-4"></i></span><input id="password" name="password" type="password" class="input pr-12" autocomplete="current-password" /><button type="button" class="toggle-pw" data-toggle-pw aria-label="Show password"><i data-icon="eye" class="h-4 w-4"></i></button></div>
    <p class="field-error" data-error-for="password" hidden></p>
  </div>
  <label class="flex cursor-pointer items-start gap-2.5 text-sm text-muted select-none"><input type="checkbox" name="remember" class="checkbox" /><span>Remember me for 30 days</span></label>
  <div data-form-error hidden></div>
  <button type="submit" class="btn btn-primary btn-lg w-full">Log In</button>
</form>
<p class="mt-8 text-center text-xs leading-relaxed text-dim">Protected by rate limiting and optional two-factor authentication. Never share your password or 2FA codes with anyone.</p>
