<!-- @page {"title": "Two-factor verification", "description": "Enter your authentication code.", "layout": "auth", "script": "auth-2fa", "robots": "noindex"} -->
<div class="grid h-12 w-12 place-items-center rounded-2xl border border-accent/25 bg-accent-soft text-accent"><i data-icon="shield-check" class="h-6 w-6"></i></div>
<h1 class="mt-6 font-display text-3xl font-extrabold tracking-tight text-white">Two-factor verification</h1>
<p class="mt-2 text-sm text-muted" data-hint>Enter the 6-digit code from your authenticator app.</p>
<form method="post" id="mfa-form" class="mt-8 space-y-5" novalidate>
  <div class="field">
    <label class="label" for="code" data-code-label>Authentication code</label>
    <input id="code" name="code" class="input text-center font-mono text-lg tracking-[0.4em]" inputmode="numeric" autocomplete="one-time-code" maxlength="6" autofocus />
    <p class="field-error" data-error-for="code" hidden></p>
  </div>
  <div data-form-error hidden></div>
  <button type="submit" class="btn btn-primary btn-lg w-full">Verify and continue</button>
</form>
<div class="mt-6 flex items-center justify-between text-sm">
  <button type="button" id="toggle-backup" class="font-semibold text-accent hover:text-accent-strong">Use a backup code</button>
  <a href="/login" class="text-muted hover:text-white">Back to login</a>
</div>
