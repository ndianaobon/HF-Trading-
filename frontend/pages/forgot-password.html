<!-- @page {"title": "Forgot password", "description": "Reset your HarborFinance password.", "layout": "auth", "script": "auth-forgot", "robots": "noindex"} -->
<div id="forgot-root">
  <div class="grid h-12 w-12 place-items-center rounded-2xl border border-accent/25 bg-accent-soft text-accent"><i data-icon="key-round" class="h-6 w-6"></i></div>
  <h1 class="mt-6 font-display text-3xl font-extrabold tracking-tight text-white">Reset your password</h1>
  <p class="mt-2 text-sm text-muted">Enter the email you registered with and we'll send you a reset link.</p>
  <form method="post" id="forgot-form" class="mt-8 space-y-5" novalidate>
    <div class="field"><label class="label" for="email">Email</label><input id="email" name="email" type="email" class="input" autocomplete="email" /><p class="field-error" data-error-for="email" hidden></p></div>
    <div data-form-error hidden></div>
    <button type="submit" class="btn btn-primary btn-lg w-full">Send reset link</button>
  </form>
  <a href="/login" class="mt-6 inline-flex text-sm text-muted hover:text-white">← Back to login</a>
</div>
