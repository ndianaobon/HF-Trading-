<!doctype html>
<html lang="en">
  <head>
    <!-- @include head -->
  </head>
  <body data-layout="app" data-path="{{path}}">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:rounded-lg focus:bg-accent focus:px-3 focus:py-2 focus:text-accent-ink">Skip to content</a>
    <div class="flex min-h-dvh">
      <aside class="fixed inset-y-0 left-0 z-40 hidden w-[264px] flex-col border-r border-line bg-base-2 lg:flex" id="sidebar">
        <div class="flex h-16 shrink-0 items-center border-b border-line px-5"><!-- @include logo --></div>
        <!-- @include app-nav -->
      </aside>

      <div id="drawer" class="fixed inset-0 z-[60] lg:hidden" hidden>
        <div class="absolute inset-0 animate-fade-in bg-[rgb(0_0_0/0.6)] backdrop-blur-sm" data-drawer-close></div>
        <aside class="absolute inset-y-0 left-0 flex w-[min(86vw,320px)] animate-slide-up flex-col border-r border-line bg-base-2">
          <div class="flex h-16 shrink-0 items-center justify-between border-b border-line px-4">
            <!-- @include logo -->
            <button type="button" class="grid h-9 w-9 place-items-center rounded-lg text-muted hover:text-white" aria-label="Close menu" data-drawer-close><i data-icon="x" class="h-5 w-5"></i></button>
          </div>
          <!-- @include app-nav -->
        </aside>
      </div>

      <div class="flex min-w-0 flex-1 flex-col lg:pl-[264px]">
        <header class="sticky top-0 z-30 border-b border-line bg-base/85 backdrop-blur-xl">
          <div class="flex h-16 items-center gap-3 px-4 sm:px-6">
            <button type="button" class="grid h-10 w-10 place-items-center rounded-xl text-fg hover:bg-panel-2 lg:hidden" aria-label="Open menu" data-drawer-open><i data-icon="menu" class="h-6 w-6"></i></button>
            <div class="header-logo flex min-w-0 items-center lg:hidden"><!-- @include logo --></div>
            <div class="relative hidden w-full max-w-sm md:block" data-search></div>
            <!-- @include topbar-actions -->
          </div>
          <div class="relative overflow-hidden border-t border-line bg-base-2/80" data-app-ticker aria-label="Live prices"></div>
        </header>
        <div id="verify-banner" hidden class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 border-b border-warn/25 bg-warn-soft px-4 py-2 text-center text-xs text-warn">
          <i data-icon="mail-warning" class="h-4 w-4"></i>
          <span>Your email address is not verified. Deposits, trading and withdrawals are disabled until you verify.</span>
          <a href="/verify-email" class="font-bold underline underline-offset-2">Verify now</a>
        </div>
        <main id="main" class="flex-1 px-4 pt-5 pb-24 sm:px-6 sm:pt-6 lg:px-8 lg:pb-12">
          <div class="mx-auto max-w-[1480px]" id="page">{{content}}</div>
        </main>
      </div>


      <button type="button" class="chat-fab" data-chat-fab aria-label="Open live support chat"><i data-icon="message-circle" class="h-6 w-6"></i><span class="absolute right-0 bottom-0 h-3.5 w-3.5 rounded-full border-2 border-base bg-up"></span></button>
    </div>
  </body>
</html>
